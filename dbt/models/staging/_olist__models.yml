models:
  - name: stg_olist__orders
    description: One row per order, typed.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_olist__order_items
    description: One row per item within an order.
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: price
        data_tests: [not_null]

  - name: stg_olist__order_payments
    description: One row per payment instalment line of an order.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequence]
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

  - name: stg_olist__order_reviews
    description: One row per review and order. review_id alone is not unique in the source.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [review_id, order_id]
    columns:
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_olist__customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_olist__products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_olist__category_translations
    columns:
      - name: category_name_pt
        data_tests: [unique, not_null]
