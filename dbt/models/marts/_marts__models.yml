models:
  - name: dim_customers
    description: One row per customer_id (Olist issues a new customer_id per order).
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: dim_products
    description: One row per product, with the English category name.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_category
        data_tests: [not_null]



  - name: dim_customer_profiles
    description: >
      One row per customer (customer_unique_id), built from orders that were
      not canceled or unavailable. Home state is the state of the most recent order.
    semantic_model: true
    agg_time_dimension: first_purchase_date
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: customer
      - name: first_purchase_date
        data_tests: [not_null]
        granularity: day
        dimension:
          type: time
      - name: home_state
        dimension:
          type: categorical
      - name: is_repeat_customer
        dimension:
          type: categorical

      - name: repeated_within_90d
        description: Second order within 90 days of the first. Null if the 90-day window was not complete.
        dimension:
          type: categorical
    metrics:
      - name: new_customers
        type: simple
        agg: count
        expr: customer_unique_id
        description: Customers by the date of their first valid order (canceled and unavailable excluded).
      - name: repeat_customers
        type: simple
        agg: count
        expr: customer_unique_id
        filter: "{{ Dimension('customer__is_repeat_customer') }} = true"
        description: Customers with more than one valid order (canceled and unavailable excluded).

      - name: repeat_purchase_rate
        type: ratio
        numerator: repeat_customers
        denominator: new_customers
        description: Share of customers with more than one valid order, at any time. Lower for recent cohorts.
      - name: repeat_customers_90d
        type: simple
        agg: count
        expr: customer_unique_id
        filter: "{{ Dimension('customer__repeated_within_90d') }} = true"
        description: Helper for repeat_rate_90d. Customers who ordered again within 90 days of their first order.


      - name: customers_with_90d_window
        type: simple
        agg: count
        expr: customer_unique_id
        filter: "{{ Dimension('customer__repeated_within_90d') }} is not null"
        description: Helper for repeat_rate_90d. Customers whose first order was at least 90 days before the end of the data.

      - name: repeat_rate_90d
        type: ratio
        numerator: repeat_customers_90d
        denominator: customers_with_90d_window
        description: Share of customers who ordered again within 90 days of their first order. Excludes customers whose 90-day window had not ended.






  - name: fct_orders
    description: >
      One row per order with value, payment, delivery performance and the
      latest review score. Main input for the semantic layer.
    semantic_model: true
    agg_time_dimension: purchase_date
    columns:
      - name: order_id
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: olist_order
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: purchase_date
        data_tests: [not_null]
        granularity: day
        dimension:
          type: time
      - name: order_value
        description: Item prices plus freight.
      - name: payment_value
        description: Sum of all payment lines. Can differ slightly from order_value (vouchers, interest).
      - name: delivery_days
        description: Days from purchase to delivery. Null if not delivered.

      - name: customer_unique_id
        entity:
          type: foreign
          name: customer
      - name: order_status
        dimension:
          type: categorical
      - name: customer_state
        dimension:
          type: categorical
      - name: is_delivered_late
        description: Delivered after the estimated date. Null if not delivered.
        dimension:
          type: categorical

    metrics:
      - name: orders                 # simple
        type: simple
        agg: count
        expr: order_id
        description: Number of orders, all statuses including canceled and unavailable.


      - name: revenue                # simple
        type: simple
        agg: sum
        expr: order_value
        description: Total order value in BRL (item prices plus freight), all statuses. Default metric for revenue questions by customer, region or time.


      - name: delivered_orders       # simple with a filter
        type: simple
        agg: count
        expr: order_id
        filter: "{{ Dimension('olist_order__order_status') }} = 'delivered'"
        description: Number of orders with status delivered.


      - name: average_order_value    # ratio
        type: ratio
        numerator: revenue
        denominator: orders
        description: Average order value in BRL (revenue divided by orders), including freight.


      - name: cumulative_revenue     # cumulative
        type: cumulative
        input_metric: revenue
        description: Running total of revenue in BRL over time, including freight.


      - name: revenue_growth_mom     # derived with time offset
        type: derived
        expr: (revenue - revenue_prev_month) / nullif(revenue_prev_month, 0)
        input_metrics:
          - name: revenue
          - name: revenue
            offset_window: 1 month
            alias: revenue_prev_month
        description: Month-over-month revenue growth as a share (0.1 = 10%). Use with metric_time__month.


      - name: customers     # Simple
        type: simple
        agg: count_distinct
        expr: customer_unique_id
        description: Distinct customers (customer_unique_id) with any order, all statuses. Use new_customers for acquisition questions.


      - name: avg_delivery_days
        type: simple
        agg: average
        expr: delivery_days
        description: Average days from purchase to delivery, delivered orders only.



      - name: avg_review_score
        type: simple
        agg: average
        expr: review_score
        description: Average review score on a 1 to 5 scale, using the latest review per order.


      - name: late_deliveries
        type: simple
        agg: count
        expr: order_id
        filter: "{{ Dimension('olist_order__is_delivered_late') }} = true"
        description: Helper for late_delivery_rate. Orders delivered after the estimated date.


      - name: measured_deliveries
        type: simple
        agg: count
        expr: order_id
        filter: "{{ Dimension('olist_order__is_delivered_late') }} is not null"
        description: Helper for late_delivery_rate. Delivered orders with a known delivery date.


      - name: late_delivery_rate
        type: ratio
        numerator: late_deliveries
        denominator: measured_deliveries
        description: Share of orders with a known delivery date that arrived after the estimate.

